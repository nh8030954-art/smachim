name: Restore site version

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Commit SHA shown next to the version in the admin panel'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: restore-site
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate requested version
        shell: bash
        env:
          TARGET: ${{ inputs.target_commit }}
        run: |
          set -euo pipefail
          git rev-parse --verify "${TARGET}^{commit}" >/dev/null
          git merge-base --is-ancestor "$TARGET" HEAD
          git cat-file -e "${TARGET}:index.html"
          git cat-file -e "${TARGET}:assets"

      - name: Restore index and assets
        shell: bash
        env:
          TARGET: ${{ inputs.target_commit }}
        run: |
          set -euo pipefail
          git checkout "$TARGET" -- index.html assets

      - name: Commit restored site
        shell: bash
        env:
          TARGET: ${{ inputs.target_commit }}
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html assets; then
            echo "Selected version is already active."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets
          git commit -m "Restore site version ${TARGET:0:8}"
          git push
