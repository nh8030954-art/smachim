name: Snapshot previous site version

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Save previous site files
        shell: bash
        run: |
          set -euo pipefail
          PARENT="$(git rev-parse HEAD^)"
          SHORT="$(git rev-parse --short "$PARENT")"
          STAMP="$(date -u +'%Y-%m-%d-%H%M%S')"
          CREATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          CHANGE_TITLE="$(git log -1 --pretty=%s HEAD)"
          FILE="versions/${STAMP}-${SHORT}.html"
          ZIP="versions/${STAMP}-${SHORT}-site.zip"
          mkdir -p versions
          git show "${PARENT}:index.html" > "$FILE"
          git archive --format=zip --output="$ZIP" "$PARENT" index.html assets

          python3 - "$FILE" "$ZIP" "$PARENT" "$STAMP" "$CREATED_AT" "$CHANGE_TITLE" <<'PY'
          import json, pathlib, sys
          file_path, zip_path, parent, stamp, created_at, change_title = sys.argv[1:7]
          manifest_path = pathlib.Path("versions/manifest.json")
          if manifest_path.exists():
              data = json.loads(manifest_path.read_text(encoding="utf-8"))
          else:
              data = {"versions": []}
          versions = data.setdefault("versions", [])
          entry = {
              "id": pathlib.Path(file_path).stem,
              "label": f"גיבוי אוטומטי לפני שינוי {stamp}",
              "date": stamp[:10],
              "created_at": created_at,
              "change_title": change_title,
              "commit": parent,
              "path": file_path,
              "archive": zip_path,
              "note": "נוצר אוטומטית לפני שינוי באתר. כולל index.html ותיקיית assets."
          }
          if not any(v.get("path") == file_path for v in versions):
              versions.insert(0, entry)
          manifest_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          # When the bootstrap asset changes, change its query string in index.html too.
          # This prevents mobile browsers/CDNs from continuing to use an older cached copy.
          if git diff --name-only "$PARENT" HEAD | grep -qx 'assets/security-bootstrap.js'; then
            python3 - "$STAMP" <<'PY'
          import pathlib, re, sys
          path = pathlib.Path("index.html")
          text = path.read_text(encoding="utf-8")
          stamp = re.sub(r"[^0-9]", "", sys.argv[1])
          text, count = re.subn(r'(assets/security-bootstrap\.js\?v=)[^"\x27]+', r'\g<1>deploy-' + stamp, text)
          if count:
              path.write_text(text, encoding="utf-8")
          PY
          fi

      - name: Commit snapshot
        shell: bash
        run: |
          if git diff --quiet -- versions index.html; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions index.html
          git commit -m "Snapshot previous site version"
          git push
