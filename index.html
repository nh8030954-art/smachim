<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>שמחים בשמחתם</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Assistant', 'sans-serif'], serif: ['Frank Ruhl Libre', 'serif'] },
                    colors: { brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 700: '#0f766e', 900: '#134e4a', dark: '#0f172a' } }
                }
            }
        }
    </script>
    <style>
        body { background-color: #F8FAFC; color: #0f172a; }
        .screen { display: none; opacity: 0; transition: opacity 0.3s ease; }
        .screen.active { display: block; opacity: 1; }
        .glass-card { background: #ffffff; border: 1px solid rgba(226, 232, 240, 0.8); box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.05); border-radius: 1rem; overflow: hidden; }
        .input-clean { width: 100%; padding: 0.75rem 1rem; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.5rem; color: #0f172a; transition: all 0.2s; font-family: 'Assistant', sans-serif; }
        .input-clean:focus { background-color: #fff; border-color: #0d9488; outline: none; box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1); }
        .btn-brand { background:#0d9488; color:#fff; font-weight:700; border-radius:.5rem; transition:.2s; }
        .btn-brand:hover { background:#0f766e; }
        .btn-dark { background:#0f172a; color:#fff; font-weight:700; border-radius:.5rem; transition:.2s; }
        .btn-dark:hover { background:#1e293b; }
        .btn-soft { background:#f1f5f9; color:#334155; font-weight:700; border-radius:.5rem; transition:.2s; }
        .btn-soft:hover { background:#e2e8f0; }
        .status-pill { display:inline-flex; align-items:center; padding:.25rem .65rem; border-radius:999px; font-size:.75rem; font-weight:700; }
        button:disabled { opacity:.55; cursor:not-allowed; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased">
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="cursor-pointer flex items-center gap-2" onclick="navigate('home')">
                <i class="fa-solid fa-ring text-brand-600 text-xl"></i>
                <h1 class="text-xl font-serif font-bold text-brand-dark tracking-wide">שמחים בשמחתם</h1>
            </div>
            <div id="header-actions">
                <button onclick="navigate('home')" class="text-sm font-semibold text-slate-500 hover:text-brand-600 transition">
                    <i class="fa-solid fa-house ml-1"></i> דף הבית
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow w-full">
        <!-- דף הבית -->
        <div id="view-home" class="screen active">
            <div class="bg-brand-dark text-white py-20 px-4 text-center border-b-[6px] border-brand-500 relative overflow-hidden">
                <div class="max-w-4xl mx-auto relative z-10">
                    <h1 class="text-5xl md:text-7xl font-serif font-black mb-6 tracking-tight">שמחים בשמחתם</h1>
                    <p class="text-2xl md:text-3xl font-serif font-light text-brand-100 italic">"כל המשמח חתן וכלה כאילו בנה אחת מחורבות ירושלים"</p>
                </div>
            </div>
            <div class="max-w-5xl mx-auto px-6 py-16">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <button onclick="navigate('register-volunteer')" class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl transition flex flex-col items-center text-center">
                        <div class="w-16 h-16 bg-brand-50 rounded-full flex items-center justify-center mb-4 text-brand-600 text-2xl"><i class="fa-solid fa-hand-holding-heart"></i></div>
                        <span class="text-2xl font-bold text-slate-800 mb-2">אני רוצה לשמח</span>
                        <span class="text-slate-500">הרשמה מלאה וחיפוש אירועים מתאימים.</span>
                    </button>
                    <button onclick="openAddEvent()" class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl transition flex flex-col items-center text-center">
                        <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mb-4 text-slate-700 text-2xl"><i class="fa-solid fa-calendar-plus"></i></div>
                        <span class="text-2xl font-bold text-slate-800 mb-2">יש לי אירוע</span>
                        <span class="text-slate-500">הרשמה כבעל שמחה ופרסום החתונה.</span>
                    </button>
                    <button onclick="openPersonalArea()" class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm hover:shadow-xl transition flex flex-col items-center text-center">
                        <div class="w-16 h-16 bg-slate-50 rounded-full flex items-center justify-center mb-4 text-slate-700 text-2xl"><i class="fa-solid fa-user"></i></div>
                        <span class="text-2xl font-bold text-slate-800 mb-2">אזור אישי</span>
                        <span class="text-slate-500">התחברות וניהול אירועים או התנדבויות.</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- התחברות -->
        <div id="view-login" class="screen max-w-md mx-auto px-6 py-20">
            <div class="glass-card p-8 text-center">
                <h2 class="text-2xl font-bold mb-2 text-brand-dark">התחברות לאזור האישי</h2>
                <p class="text-sm text-slate-500">ההתחברות המאובטחת מתבצעת באמצעות אימייל וסיסמה.</p>
                <form id="login-form" onsubmit="event.preventDefault(); handleLogin();" class="space-y-4 mt-6">
                    <input type="email" id="login-email" class="input-clean" placeholder="כתובת אימייל" dir="ltr" required autocomplete="email">
                    <input type="password" id="login-password" class="input-clean" placeholder="סיסמה" required autocomplete="current-password">
                    <button id="login-submit" type="submit" class="w-full btn-dark py-3">כניסה למערכת</button>
                    <button type="button" onclick="handleForgotPassword()" class="text-sm font-semibold text-brand-600 hover:underline">שכחתי סיסמה</button>
                </form>
            </div>
        </div>

        <!-- הרשמה למשמח -->
        <div id="view-register-volunteer" class="screen max-w-2xl mx-auto px-6 py-12">
            <div class="glass-card p-8">
                <h2 class="text-2xl font-bold mb-2 text-brand-dark">הרשמה - משמח חתן וכלה</h2>
                <form id="volunteer-form" onsubmit="event.preventDefault(); handleRegisterVolunteer();" class="space-y-4 mt-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="vol-name" class="input-clean" placeholder="שם מלא" required>
                        <input type="text" id="vol-phone" class="input-clean" placeholder="מספר טלפון" dir="ltr" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="email" id="vol-email" class="input-clean" placeholder="כתובת אימייל" dir="ltr" required>
                        <input type="password" id="vol-pass" class="input-clean" placeholder="סיסמה (לפחות 8 תווים)" minlength="8" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <select id="vol-gender" class="input-clean bg-white" required>
                            <option value="" disabled selected>מין לצורך התאמת המכסה</option>
                            <option value="male">גבר</option>
                            <option value="female">אישה</option>
                        </select>
                        <select id="vol-sector" class="input-clean bg-white" required>
                            <option value="" disabled selected>שיוך מגזרי</option>
                            <option value="haredi">חרדי</option>
                            <option value="religious">דתי לאומי</option>
                            <option value="traditional">מסורתי</option>
                            <option value="secular">חילוני</option>
                        </select>
                    </div>
                    <input type="text" id="vol-address" class="input-clean" placeholder="כתובת מגורים מלאה" required>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="number" id="vol-radius" min="1" max="300" class="input-clean" placeholder="רדיוס מקסימלי (ק״מ)" required>
                        <select id="vol-days" class="input-clean bg-white" required>
                            <option value="1">עד יום אחד בשבוע</option>
                            <option value="2">עד יומיים בשבוע</option>
                            <option value="3" selected>עד 3 ימים בשבוע</option>
                            <option value="7">ללא הגבלה</option>
                        </select>
                    </div>
                    <label class="flex items-center gap-3 p-3 bg-slate-50 border border-slate-200 rounded-lg cursor-pointer">
                        <input type="checkbox" id="vol-separation" class="w-5 h-5 text-brand-600 rounded">
                        <span class="font-bold text-slate-700 text-sm">קבל אך ורק אירועים בהפרדה מלאה</span>
                    </label>
                    <button id="vol-submit" type="submit" class="w-full btn-brand py-4">השלם הרשמה</button>
                </form>
            </div>
        </div>

        <!-- פרסום כבעל שמחה -->
        <div id="view-add-event" class="screen max-w-3xl mx-auto px-6 py-12">
            <div class="glass-card p-8">
                <h2 class="text-2xl font-bold mb-6 text-brand-dark border-b pb-4">הרשמה ופרסום כבעל שמחה</h2>
                <form id="event-form" onsubmit="event.preventDefault(); handleCreateEvent();" class="space-y-6">
                    <div id="host-account-block" class="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-4">
                        <h3 class="font-bold text-slate-800 text-sm">פרטי התחברות לחשבון</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="text" id="host-name" class="input-clean bg-white" placeholder="שם מלא">
                            <input type="text" id="host-phone" class="input-clean bg-white" placeholder="מספר טלפון" dir="ltr">
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <input type="email" id="host-email" class="input-clean bg-white" placeholder="כתובת אימייל" dir="ltr">
                            <input type="password" id="host-pass" class="input-clean bg-white" placeholder="סיסמה (לפחות 8 תווים)" minlength="8">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="text" id="ev-name" class="input-clean" placeholder="שמות החתן והכלה" required>
                        <input type="date" id="ev-date" class="input-clean" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="ev-public-location" class="input-clean" placeholder="עיר / אזור שיוצגו לפני הרשמה" required>
                        <input type="text" id="ev-address" class="input-clean" placeholder="כתובת האולם המלאה (פרטית)" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="time" id="ev-start" class="input-clean" required>
                        <input type="time" id="ev-close" class="input-clean" required>
                    </div>
                    <select id="ev-sector" class="input-clean bg-white" required>
                        <option value="all" class="font-bold text-brand-600">כל המגזרים (לא משנה לי)</option>
                        <option value="haredi">חרדי</option>
                        <option value="religious">דתי לאומי</option>
                        <option value="traditional">מסורתי</option>
                        <option value="secular">חילוני</option>
                    </select>
                    <label class="flex items-center gap-3 p-3 bg-slate-50 border rounded-lg cursor-pointer">
                        <input type="checkbox" id="ev-separation" class="w-5 h-5 text-brand-600 rounded">
                        <span class="font-bold text-slate-700">אירוע בהפרדה מלאה</span>
                    </label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="number" id="ev-men" class="input-clean" placeholder="מכסת משמחים (גברים)" min="0" required>
                        <input type="number" id="ev-women" class="input-clean" placeholder="מכסת משמחות (נשים)" min="0" required>
                    </div>
                    <button id="event-submit" type="submit" class="w-full btn-dark py-4">פרסם אירוע</button>
                </form>
            </div>
        </div>

        <!-- עריכת אירוע -->
        <div id="view-edit-event" class="screen max-w-3xl mx-auto px-6 py-12">
            <div class="glass-card p-8">
                <h2 class="text-2xl font-bold mb-6 text-brand-dark border-b pb-4">עריכת אירוע</h2>
                <form id="edit-event-form" onsubmit="event.preventDefault(); saveEditEvent();" class="space-y-6">
                    <input type="hidden" id="edit-event-id">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="text" id="edit-ev-name" class="input-clean" placeholder="שמות החתן והכלה" required>
                        <input type="date" id="edit-ev-date" class="input-clean" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="text" id="edit-ev-public-location" class="input-clean" placeholder="עיר / אזור" required>
                        <input type="text" id="edit-ev-address" class="input-clean" placeholder="כתובת האולם המלאה" required>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="time" id="edit-ev-start" class="input-clean" required>
                        <input type="time" id="edit-ev-close" class="input-clean" required>
                    </div>
                    <select id="edit-ev-sector" class="input-clean bg-white" required>
                        <option value="all">כל המגזרים</option>
                        <option value="haredi">חרדי</option>
                        <option value="religious">דתי לאומי</option>
                        <option value="traditional">מסורתי</option>
                        <option value="secular">חילוני</option>
                    </select>
                    <label class="flex items-center gap-3 p-3 bg-slate-50 border rounded-lg cursor-pointer">
                        <input type="checkbox" id="edit-ev-separation" class="w-5 h-5 text-brand-600 rounded">
                        <span class="font-bold text-slate-700">אירוע בהפרדה מלאה</span>
                    </label>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <input type="number" id="edit-ev-men" class="input-clean" placeholder="מכסת משמחים" min="0" required>
                        <input type="number" id="edit-ev-women" class="input-clean" placeholder="מכסת משמחות" min="0" required>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="navigate('dashboard')" class="btn-soft py-3">ביטול</button>
                        <button id="edit-event-submit" type="submit" class="btn-dark py-3">שמור שינויים</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- הגדרות פרופיל -->
        <div id="view-profile-settings" class="screen max-w-2xl mx-auto px-6 py-12">
            <div class="glass-card p-8">
                <h2 class="text-2xl font-bold mb-6 text-brand-dark border-b pb-4">הגדרות פרופיל</h2>
                <form id="profile-form" onsubmit="event.preventDefault(); saveProfileSettings();" class="space-y-4">
                    <input type="text" id="profile-name" class="input-clean" placeholder="שם מלא" required>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <select id="profile-gender" class="input-clean bg-white">
                            <option value="">לא רלוונטי / לא הוגדר</option>
                            <option value="male">גבר</option>
                            <option value="female">אישה</option>
                        </select>
                        <select id="profile-sector" class="input-clean bg-white" required>
                            <option value="haredi">חרדי</option>
                            <option value="religious">דתי לאומי</option>
                            <option value="traditional">מסורתי</option>
                            <option value="secular">חילוני</option>
                            <option value="all">כללי</option>
                        </select>
                    </div>
                    <input type="text" id="profile-address" class="input-clean" placeholder="כתובת מגורים">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <input type="number" id="profile-radius" min="1" max="300" class="input-clean" placeholder="רדיוס בק״מ">
                        <select id="profile-days" class="input-clean bg-white">
                            <option value="1">עד יום אחד בשבוע</option>
                            <option value="2">עד יומיים בשבוע</option>
                            <option value="3">עד 3 ימים בשבוע</option>
                            <option value="7">ללא הגבלה</option>
                        </select>
                    </div>
                    <label class="flex items-center gap-3 p-3 bg-slate-50 border rounded-lg cursor-pointer">
                        <input type="checkbox" id="profile-separation" class="w-5 h-5 text-brand-600 rounded">
                        <span class="font-bold text-slate-700">קבל אך ורק אירועים בהפרדה מלאה</span>
                    </label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" onclick="navigate('dashboard')" class="btn-soft py-3">ביטול</button>
                        <button id="profile-submit" type="submit" class="btn-brand py-3">שמור</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- איפוס סיסמה -->
        <div id="view-reset-password" class="screen max-w-md mx-auto px-6 py-20">
            <div class="glass-card p-8 text-center">
                <h2 class="text-2xl font-bold mb-2 text-brand-dark">בחירת סיסמה חדשה</h2>
                <form onsubmit="event.preventDefault(); updateRecoveredPassword();" class="space-y-4 mt-6">
                    <input type="password" id="new-password" class="input-clean" minlength="8" placeholder="סיסמה חדשה (לפחות 8 תווים)" required>
                    <button type="submit" class="w-full btn-dark py-3">עדכן סיסמה</button>
                </form>
            </div>
        </div>

        <!-- אזור אישי -->
        <div id="view-dashboard" class="screen max-w-6xl mx-auto px-6 py-10">
            <div class="flex flex-wrap gap-3 justify-between items-center mb-8">
                <h2 id="user-greeting" class="text-3xl font-bold text-brand-dark">אזור אישי</h2>
                <div class="flex gap-2">
                    <button onclick="openProfileSettings()" class="btn-soft px-4 py-2 text-sm"><i class="fa-solid fa-gear ml-1"></i> הגדרות</button>
                    <button onclick="handleLogout()" class="bg-red-50 text-red-600 px-4 py-2 rounded-lg font-bold text-sm">התנתק</button>
                </div>
            </div>
            <div id="dashboard-content" class="space-y-8"></div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = 'https://ybccbyyrrxdzarsgylql.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_JjkT61xxSWFUImTeMNHWxA_e1zkZWr-';
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });

        let currentUser = null;
        let currentProfile = null;
        let currentIsAdmin = false;
        let hostEventsCache = new Map();
        let privateEventCache = new Map();
        let passwordRecoveryMode = false;

        const $ = (id) => document.getElementById(id);
        const esc = (value) => String(value ?? '')
            .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

        function navigate(view) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            const target = $('view-' + view);
            if (target) target.classList.add('active');
            window.scrollTo(0, 0);
        }

        function setBusy(buttonId, busy, busyText='טוען...') {
            const btn = $(buttonId);
            if (!btn) return;
            if (busy) {
                btn.dataset.oldText = btn.innerHTML;
                btn.disabled = true;
                btn.textContent = busyText;
            } else {
                btn.disabled = false;
                if (btn.dataset.oldText) btn.innerHTML = btn.dataset.oldText;
            }
        }

        function normalizePhone(phone) {
            return String(phone || '').replace(/[\s\-()]/g, '');
        }

        function authRedirectUrl() {
            return window.location.origin + window.location.pathname;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr + 'T12:00:00');
            return new Intl.DateTimeFormat('he-IL', { day:'2-digit', month:'2-digit', year:'numeric' }).format(d);
        }

        function sectorLabel(v) {
            return ({haredi:'חרדי', religious:'דתי לאומי', traditional:'מסורתי', secular:'חילוני', all:'כל המגזרים'})[v] || v || '';
        }

        function registrationLabel(v) {
            return ({approved:'מאושר', waitlist:'רשימת המתנה', cancelled:'בוטל'})[v] || v;
        }

        function registrationPill(v) {
            if (v === 'approved') return '<span class="status-pill bg-green-50 text-green-700">מאושר</span>';
            if (v === 'waitlist') return '<span class="status-pill bg-amber-50 text-amber-700">רשימת המתנה</span>';
            return '<span class="status-pill bg-slate-100 text-slate-600">בוטל</span>';
        }

        function eventStatusLabel(ev) {
            if (ev.status === 'cancelled') return 'בוטל';
            if (ev.event_date < new Date().toISOString().slice(0,10)) return 'הסתיים';
            if (ev.status === 'full') return 'מלא / רשימת המתנה';
            return 'פעיל';
        }

        function readableError(error) {
            const m = String(error?.message || error || 'שגיאה לא ידועה');
            const pairs = [
                ['weekly_limit_reached','הגעת למספר ימי ההתנדבות המקסימלי שהגדרת לשבוע זה.'],
                ['gender_required','יש להגדיר מין בפרופיל כדי להתאים למכסת האירוע.'],
                ['user_blocked','החשבון חסום כרגע.'],
                ['event_unavailable','האירוע אינו זמין להרשמה.'],
                ['cannot_register_own_event','לא ניתן להירשם כמשמח לאירוע שפרסמת.'],
                ['quota_below_existing_registrations','אי אפשר להקטין מכסה מתחת למספר הנרשמים שכבר אושרו.'],
                ['invalid_event_times','שעת הסיום חייבת להיות מאוחרת משעת ההתחלה.'],
                ['gender_change_with_active_registrations','לא ניתן לשנות מין כל עוד יש לך הרשמות פעילות לאירועים עתידיים.'],
                ['report_reason_required','יש לכתוב סיבה קצרה לדיווח.'],
                ['event_date_in_past','לא ניתן לבחור תאריך שכבר עבר.'],
                ['Invalid login credentials','האימייל או הסיסמה שגויים.'],
                ['User already registered','כבר קיים חשבון עם האימייל הזה. התחבר כדי להמשיך.']
            ];
            for (const [key, text] of pairs) if (m.includes(key)) return text;
            return m;
        }

        async function geocodeAddress(address) {
            if (!address || address.trim().length < 3) return {lat:null, lng:null};
            try {
                const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=il&accept-language=he&q=' + encodeURIComponent(address + ', ישראל');
                const res = await fetch(url, { headers: { 'Accept': 'application/json' } });
                if (!res.ok) return {lat:null,lng:null};
                const rows = await res.json();
                if (!rows?.length) return {lat:null,lng:null};
                return { lat: Number(rows[0].lat), lng: Number(rows[0].lon) };
            } catch (_) {
                return {lat:null,lng:null};
            }
        }

        async function loadProfile(retries=3) {
            if (!currentUser) return null;
            for (let i=0; i<retries; i++) {
                const { data, error } = await _supabase.from('profiles').select('*').eq('auth_user_id', currentUser.id).maybeSingle();
                if (!error && data) {
                    currentProfile = data;
                    return data;
                }
                await new Promise(r => setTimeout(r, 500));
            }
            currentProfile = null;
            return null;
        }

        async function handleSession(session) {
            currentUser = session?.user || null;
            if (!currentUser) {
                currentProfile = null;
                currentIsAdmin = false;
                return;
            }

            await loadProfile();
            const { data: adminFlag } = await _supabase.rpc('is_admin');
            currentIsAdmin = !!adminFlag;

            if (currentProfile?.is_blocked) {
                alert('החשבון חסום כרגע.');
                await _supabase.auth.signOut();
                navigate('home');
                return;
            }

            if (passwordRecoveryMode || window.location.hash.includes('type=recovery')) {
                navigate('reset-password');
                return;
            }

            await finalizePendingEvent();
        }

        async function initAuth() {
            const { data: { session } } = await _supabase.auth.getSession();
            await handleSession(session);
            _supabase.auth.onAuthStateChange((event, session) => {
                if (event === 'PASSWORD_RECOVERY') passwordRecoveryMode = true;
                setTimeout(() => handleSession(session), 0);
            });
        }

        async function openPersonalArea() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return navigate('login');
            await handleSession(session);
            await loadDashboard();
        }

        async function handleRegisterVolunteer() {
            setBusy('vol-submit', true, 'יוצר חשבון...');
            try {
                const name = $('vol-name').value.trim();
                const phone = normalizePhone($('vol-phone').value);
                const email = $('vol-email').value.trim().toLowerCase();
                const password = $('vol-pass').value;
                const gender = $('vol-gender').value;
                const sector = $('vol-sector').value;
                const address = $('vol-address').value.trim();
                const radius = Number($('vol-radius').value);
                const maxDays = Number($('vol-days').value);
                const separation = $('vol-separation').checked;

                const coords = await geocodeAddress(address);
                const { data, error } = await _supabase.auth.signUp({
                    email, password,
                    options: {
                        emailRedirectTo: authRedirectUrl(),
                        data: {
                            full_name:name, phone, gender, sector, address,
                            radius, max_days_per_week:maxDays,
                            strict_separation:separation,
                            lat:coords.lat, lng:coords.lng,
                            role:'volunteer'
                        }

                });
                if (error) throw error;
                if (data.session) {
                    currentUser = data.user;

                    alert('החשבון נוצר. שלחנו אליך הודעת אימות באימייל. לאחר האישור תוכל להתחבר.');
                    navigate('login');
                    $('login-email').value = email;

                alert(readableError(e));

                setBusy('vol-submit', false);

        async function handleLogin() {
            setBusy('login-submit', true, 'מתחבר...');
            try {
                const email = $('login-email').value.trim().toLowerCase();
                const password = $('login-password').value;
                const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
                if (error) throw error;
                await handleSession(data.session);
                await loadDashboard();
            } catch (e) {
                alert(readableError(e));
            } finally {
                setBusy('login-submit', false);
            }

        async function handleForgotPassword() {
            let email = $('login-email').value.trim();
            if (!email) email = prompt('הכנס כתובת אימייל לקבלת קישור לאיפוס סיסמה:') || '';
            if (!email) return;
            const { error } = await _supabase.auth.resetPasswordForEmail(email, { redirectTo: authRedirectUrl() });
            if (error) alert(readableError(error));
            else alert('נשלח אליך קישור לאיפוס הסיסמה.');
        }

        async function updateRecoveredPassword() {
            const password = $('new-password').value;
            const { error } = await _supabase.auth.updateUser({ password });
            if (error) return alert(readableError(error));
            passwordRecoveryMode = false;
            history.replaceState({}, document.title, authRedirectUrl());

        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            currentUser = null;
            currentProfile = null;
            currentIsAdmin = false;
            navigate('home');
        }

        async function openAddEvent() {
            const { data: { session } } = await _supabase.auth.getSession();
            currentUser = session?.user || null;
            if (currentUser && !currentProfile) await loadProfile();
            const block = $('host-account-block');
            const fields = ['host-name','host-phone','host-email','host-pass'];
            if (currentUser) {
                block.classList.add('hidden');
                fields.forEach(id => $(id).required = false);
            } else {
                block.classList.remove('hidden');
                fields.forEach(id => $(id).required = true);

        function collectEventForm(prefix='') {
            const id = (name) => $(prefix + name);
            return {
                couple_names: id('ev-name').value.trim(),
                event_date: id('ev-date').value,
                public_location: id('ev-public-location').value.trim(),
                hall_address: id('ev-address').value.trim(),
                start_time: id('ev-start').value,
                close_time: id('ev-close').value,
                sector_pref: id('ev-sector').value,
                is_separated: id('ev-separation').checked,
                quota_men: Number(id('ev-men').value),
                quota_women: Number(id('ev-women').value)
            };
        }

        function validateEventPayload(ev) {
            if (ev.event_date < new Date().toISOString().slice(0,10)) throw new Error('event_date_in_past');
            if (ev.close_time <= ev.start_time) throw new Error('invalid_event_times');
            if (ev.quota_men < 0 || ev.quota_women < 0) throw new Error('invalid_quota');
        }

        async function createEventRpc(ev) {
            validateEventPayload(ev);
            const coords = await geocodeAddress(ev.hall_address);
            const { data, error } = await _supabase.rpc('create_event', {
                p_couple_names: ev.couple_names,
                p_event_date: ev.event_date,
                p_public_location: ev.public_location,
                p_hall_address: ev.hall_address,
                p_start_time: ev.start_time,
                p_close_time: ev.close_time,
                p_sector_pref: ev.sector_pref,
                p_is_separated: ev.is_separated,
                p_quota_men: ev.quota_men,
                p_quota_women: ev.quota_women,
                p_lat: coords.lat,
                p_lng: coords.lng
            });
            if (error) throw error;
            return data;
        }

        async function handleCreateEvent() {
            setBusy('event-submit', true, 'מפרסם אירוע...');
            try {
                const ev = collectEventForm('');
                validateEventPayload(ev);
                const { data: { session } } = await _supabase.auth.getSession();
                if (session) {
                    currentUser = session.user;
                    await loadProfile();
                    await createEventRpc(ev);
                    await loadProfile();
                    alert('האירוע פורסם בהצלחה!');
                    $('event-form').reset();
                    await loadDashboard();
                    return;
                }

                const name = $('host-name').value.trim();
                const phone = normalizePhone($('host-phone').value);
                const email = $('host-email').value.trim().toLowerCase();
                const password = $('host-pass').value;
                if (password.length < 8) throw new Error('הסיסמה חייבת לכלול לפחות 8 תווים.');

                localStorage.setItem('pendingHostEvent', JSON.stringify(ev));
                const { data, error } = await _supabase.auth.signUp({
                    email, password,
                    options: {
                        emailRedirectTo: authRedirectUrl(),
                        data: { full_name:name, phone, role:'host', sector:ev.sector_pref, address:ev.public_location }
                    }
                });
                if (error) {
                    if (String(error.message).includes('already registered')) {
                        $('login-email').value = email;
                        alert('כבר קיים חשבון עם האימייל הזה. פרטי האירוע נשמרו בדפדפן — התחבר והאירוע יפורסם לאחר הכניסה.');
                        navigate('login');
                        return;
                    }
                    throw error;
                }
                if (data.session) {
                    currentUser = data.user;
                    await loadProfile();
                    await finalizePendingEvent();
                    alert('החשבון והאירוע נוצרו בהצלחה!');
                    await loadDashboard();
                } else {
                    alert('החשבון נוצר. אשר את האימייל ולאחר ההתחברות האירוע יפורסם אוטומטית.');
                    navigate('login');
                    $('login-email').value = email;
                }
            } catch (e) {
                alert(readableError(e));
            } finally {
                setBusy('event-submit', false);
            }
        }

        async function finalizePendingEvent() {
            if (!currentUser) return;
            const raw = localStorage.getItem('pendingHostEvent');
            if (!raw) return;
            try {
                const ev = JSON.parse(raw);
                await createEventRpc(ev);
                localStorage.removeItem('pendingHostEvent');
                await loadProfile();
                alert('האירוע ששמרת פורסם בהצלחה.');
            } catch (e) {
                console.error('Pending event publication failed:', e);
            }
        }

        async function loadDashboard() {
            const { data: { session } } = await _supabase.auth.getSession();
            if (!session) return navigate('login');
            currentUser = session.user;
            await loadProfile();
            if (!currentProfile) {
                alert('לא נמצא פרופיל עבור החשבון. נסה להתנתק ולהתחבר שוב.');
                return navigate('login');
            }
            const { data: adminFlag } = await _supabase.rpc('is_admin');
            currentIsAdmin = !!adminFlag;
            $('user-greeting').innerText = `שלום, ${currentProfile.full_name || 'משתמש'}`;
            navigate('dashboard');
            const container = $('dashboard-content');
            container.innerHTML = '<div class="text-slate-500">טוען נתונים מהשרת...</div>';

            const parts = [];
            parts.push(await renderNotifications());
            if (['volunteer','both'].includes(currentProfile.role)) {
                parts.push(await renderMyRegistrations());
                parts.push(await renderMatchingEvents());
            }
            if (['host','both'].includes(currentProfile.role)) {
                parts.push(await renderHostEvents());

                parts.push(`<div class="glass-card p-6 flex flex-wrap gap-3 items-center justify-between">
                    <div><h3 class="font-bold text-lg">רוצה לפרסם גם אירוע?</h3><p class="text-sm text-slate-500">אפשר להפוך את החשבון לחשבון משולב בלי לפתוח משתמש נוסף.</p></div>
                    <button onclick="openAddEvent()" class="btn-dark px-4 py-2">פרסם אירוע</button>
                </div>`);
            }
            if (currentIsAdmin) parts.push(await renderAdminPanel());
            container.innerHTML = parts.filter(Boolean).join('');
        }

            const { data, error } = await _supabase.from('notifications').select('*').order('created_at', {ascending:false}).limit(8);
            if (error || !data?.length) return '';
            const unread = data.filter(n => !n.read_at).length;
            return `<div class="glass-card p-6">
                <div class="flex justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">התראות ${unread ? `<span class="text-sm text-brand-600">(${unread} חדשות)</span>` : ''}</h3>
                    ${unread ? '<button onclick="markNotificationsRead()" class="text-sm font-bold text-brand-600 hover:underline">סמן הכול כנקרא</button>' : ''}
                </div>
                <div class="space-y-3">
                    ${data.map(n => `<div class="p-3 rounded-lg border ${n.read_at ? 'bg-white border-slate-100' : 'bg-brand-50 border-brand-100'}">
                        <div class="font-bold text-sm">${esc(n.title)}</div>
                        <div class="text-sm text-slate-600">${esc(n.body)}</div>
                    </div>`).join('')}
                </div>
            </div>`;

        async function markNotificationsRead() {
            const { error } = await _supabase.from('notifications').update({read_at:new Date().toISOString()}).eq('user_id', currentProfile.id).is('read_at', null);
            if (error) alert(readableError(error)); else await loadDashboard();
        }

        async function fetchMyRegistrations() {
            const { data, error } = await _supabase.from('registrations')
                .select('id,event_id,status,created_at,events(id,couple_names,event_date,public_location,start_time,close_time,status)')
                .eq('user_id', currentProfile.id)
                .neq('status','cancelled')
                .order('created_at', {ascending:false});
            if (error) return [];
            return data || [];
        }

        async function renderMyRegistrations() {
            const regs = await fetchMyRegistrations();
            if (!regs.length) return `<div class="glass-card p-6"><h3 class="text-xl font-bold mb-2">ההתנדבויות שלי</h3><p class="text-slate-500">עדיין לא נרשמת לאירוע.</p></div>`;
            const approvedIds = regs.filter(r => r.status==='approved').map(r => r.event_id);
            const privateMap = new Map();
            if (approvedIds.length) {
                const { data } = await _supabase.from('event_private_details').select('event_id,hall_address').in('event_id', approvedIds);
                (data || []).forEach(x => privateMap.set(x.event_id, x.hall_address));
            }
            return `<div class="glass-card p-6">
                <h3 class="text-xl font-bold mb-4">ההתנדבויות שלי</h3>
                <div class="space-y-4">${regs.map(r => {
                    const e = r.events || {};
                    const exact = privateMap.get(r.event_id);
                    return `<div class="border p-4 rounded-xl bg-slate-50">
                        <div class="flex flex-wrap gap-3 justify-between items-start">
                            <div>
                                <div class="flex gap-2 items-center flex-wrap"><h4 class="font-bold text-lg">${esc(e.couple_names)}</h4>${registrationPill(r.status)}</div>
                                <p class="text-sm text-slate-600 mt-1">📅 ${formatDate(e.event_date)} · ⏰ ${esc(e.start_time?.slice(0,5))} · 📍 ${esc(e.public_location)}</p>
                                ${r.status==='approved' && exact ? `<p class="text-sm font-semibold text-brand-700 mt-1">כתובת מדויקת: ${esc(exact)}</p>` : ''}
                                ${e.status==='cancelled' ? '<p class="text-sm text-red-600 font-bold mt-1">האירוע בוטל</p>' : ''}
                            </div>
                            ${e.status!=='cancelled' ? `<button onclick="cancelMyRegistration('${esc(r.event_id)}')" class="bg-red-50 text-red-600 px-3 py-2 rounded-lg font-bold text-sm">בטל הרשמה</button>` : ''}
                        </div>
                    </div>`;
                }).join('')}</div>
            </div>`;
        }

        async function renderMatchingEvents() {
            const [{ data: events, error }, regs] = await Promise.all([
                _supabase.rpc('get_matching_events'),
                fetchMyRegistrations()
            ]);
            if (error) return `<div class="glass-card p-6"><h3 class="text-xl font-bold mb-2">אירועים מתאימים</h3><p class="text-red-600">${esc(readableError(error))}</p></div>`;
            const regMap = new Map(regs.map(r => [r.event_id, r.status]));
            return `<div class="glass-card p-6">
                <div class="flex flex-wrap gap-3 justify-between items-center mb-4">
                    <div><h3 class="text-xl font-bold">אירועים שמתאימים לך</h3><p class="text-sm text-slate-500">לפי מגזר, הפרדה, רדיוס ומכסה.</p></div>
                    <button onclick="loadDashboard()" class="btn-soft px-3 py-2 text-sm"><i class="fa-solid fa-rotate"></i> רענן</button>
                </div>
                <div class="space-y-4">
                    ${events?.length ? events.map(ev => {
                        const existing = regMap.get(ev.id);
                        const count = currentProfile.gender==='male' ? Number(ev.men_registered) : Number(ev.women_registered);
                        const quota = currentProfile.gender==='male' ? ev.quota_men : ev.quota_women;
                        const fullForMe = count >= quota;
                        const distance = ev.distance_km == null ? 'מרחק לא זמין' : `${ev.distance_km} ק״מ`;
                        let btn = `<button onclick="rsvpEvent('${esc(ev.id)}')" class="btn-brand px-4 py-2 text-sm">${fullForMe ? 'הצטרף לרשימת המתנה' : 'הירשם לשמח'}</button>`;
                        if (existing==='approved') btn = '<button disabled class="btn-brand px-4 py-2 text-sm">כבר רשום</button>';
                        if (existing==='waitlist') btn = '<button disabled class="bg-amber-100 text-amber-700 px-4 py-2 rounded-lg font-bold text-sm">ברשימת המתנה</button>';
                        return `<div class="border p-4 rounded-xl flex flex-col md:flex-row gap-4 md:justify-between md:items-center bg-slate-50">
                            <div>
                                <h4 class="font-bold text-lg">${esc(ev.couple_names)}</h4>
                                <p class="text-sm text-slate-600">📅 ${formatDate(ev.event_date)} · ⏰ ${esc(ev.start_time?.slice(0,5))} · 📍 ${esc(ev.public_location)}</p>
                                <p class="text-xs text-slate-500 mt-1">${esc(sectorLabel(ev.sector_pref))} · ${ev.is_separated ? 'בהפרדה' : 'ללא דרישת הפרדה'} · ${distance}</p>
                                <p class="text-xs text-slate-500 mt-1">גברים ${ev.men_registered}/${ev.quota_men} · נשים ${ev.women_registered}/${ev.quota_women}</p>
                            </div><div class="flex gap-2 items-center">${btn}<button onclick="reportEvent('${esc(ev.id)}')" class="btn-soft px-3 py-2 text-sm" title="דווח על אירוע"><i class="fa-regular fa-flag"></i></button></div>
                        </div>`;

                </div>
            </div>`;
        }

            const { error } = await _supabase.rpc('report_event', { p_event_id:eventId, p_reason:reason });

            const { data, error } = await _supabase.rpc('register_for_event', { p_event_id:eventId });
            if (error) return alert(readableError(error));

        async function cancelMyRegistration(eventId) {
            if (!confirm('לבטל את ההרשמה לאירוע?')) return;
            const { error } = await _supabase.rpc('cancel_registration', { p_event_id:eventId });
            if (error) alert(readableError(error)); else await loadDashboard();
        }

        async function renderHostEvents() {
            const { data: events, error } = await _supabase.from('events').select('*').eq('host_id', currentProfile.id).order('event_date', {ascending:false});
            if (error) return '';
            hostEventsCache = new Map((events || []).map(e => [e.id,e]));
            const ids = (events || []).map(e => e.id);
            privateEventCache = new Map();
            const regsByEvent = new Map();
            if (ids.length) {
                const [{data: privates},{data: regs}] = await Promise.all([
                    _supabase.from('event_private_details').select('*').in('event_id', ids),
                    _supabase.from('registrations').select('event_id,status').in('event_id', ids).neq('status','cancelled')
                ]);
                (privates || []).forEach(x => privateEventCache.set(x.event_id,x));
                (regs || []).forEach(r => {
                    const cur = regsByEvent.get(r.event_id) || {approved:0,waitlist:0};
                    cur[r.status] = (cur[r.status] || 0) + 1;
                    regsByEvent.set(r.event_id,cur);
                });
            }
            return `<div class="glass-card p-6">
                <div class="flex flex-wrap gap-3 justify-between items-center mb-4">
                    <h3 class="text-xl font-bold">האירועים שלי</h3>
                    <button onclick="openAddEvent()" class="btn-dark px-4 py-2 text-sm"><i class="fa-solid fa-plus ml-1"></i> אירוע חדש</button>
                </div>
                <div class="space-y-4">
                ${events?.length ? events.map(e => {
                    const c = regsByEvent.get(e.id) || {approved:0,waitlist:0};
                    const exact = privateEventCache.get(e.id)?.hall_address || '';
                    return `<div class="border p-4 rounded-xl bg-slate-50">
                        <div class="flex flex-col md:flex-row gap-4 md:justify-between md:items-start">
                            <div>
                                <div class="flex flex-wrap gap-2 items-center"><h4 class="font-bold text-lg">${esc(e.couple_names)}</h4><span class="status-pill bg-white border text-slate-600">${esc(eventStatusLabel(e))}</span></div>
                                <p class="text-sm text-slate-600">📅 ${formatDate(e.event_date)} · ⏰ ${esc(e.start_time?.slice(0,5))} · 📍 ${esc(e.public_location)}</p>
                                <p class="text-sm text-slate-500">כתובת: ${esc(exact)} · מאושרים: ${c.approved || 0} · המתנה: ${c.waitlist || 0}</p>
                            </div>
                            <div class="flex flex-wrap gap-2">
                                <button onclick="showRegistrants('${esc(e.id)}')" class="btn-soft px-3 py-2 text-sm">נרשמים</button>
                                ${e.status!=='cancelled' && e.event_date >= new Date().toISOString().slice(0,10) ? `<button onclick="openEditEvent('${esc(e.id)}')" class="btn-soft px-3 py-2 text-sm">עריכה</button><button onclick="cancelHostEvent('${esc(e.id)}')" class="bg-red-50 text-red-600 px-3 py-2 rounded-lg font-bold text-sm">ביטול אירוע</button>` : ''}
                            </div>
                        </div>
                        <div id="registrants-${esc(e.id)}" class="mt-3 hidden"></div>
                    </div>`;
                }).join('') : '<p class="text-slate-500">עדיין לא פרסמת אירוע.</p>'}
                </div>
            </div>`;
        }

        async function showRegistrants(eventId) {
            const box = $('registrants-' + eventId);
            if (!box) return;
            if (!box.classList.contains('hidden')) { box.classList.add('hidden'); return; }
            box.classList.remove('hidden');
            box.innerHTML = '<div class="text-sm text-slate-500">טוען נרשמים...</div>';
            const { data, error } = await _supabase.rpc('get_event_registrants', { p_event_id:eventId });
            if (error) return box.innerHTML = `<div class="text-sm text-red-600">${esc(readableError(error))}</div>`;
            box.innerHTML = data?.length ? `<div class="border-t pt-3 space-y-2">${data.map(r => `<div class="flex justify-between items-center text-sm"><span class="font-semibold">${esc(r.full_name)} · ${r.gender==='male'?'גבר':r.gender==='female'?'אישה':'לא הוגדר'}</span>${registrationPill(r.status)}</div>`).join('')}</div>` : '<div class="text-sm text-slate-500 border-t pt-3">אין נרשמים עדיין.</div>';
        }

        async function openEditEvent(eventId) {
            const e = hostEventsCache.get(eventId);
            if (!e) return;
            const exact = privateEventCache.get(eventId)?.hall_address || '';
            $('edit-event-id').value = e.id;
            $('edit-ev-name').value = e.couple_names || '';
            $('edit-ev-date').value = e.event_date || '';
            $('edit-ev-date').min = new Date().toISOString().slice(0,10);
            $('edit-ev-public-location').value = e.public_location || '';
            $('edit-ev-address').value = exact;
            $('edit-ev-start').value = e.start_time?.slice(0,5) || '';
            $('edit-ev-close').value = e.close_time?.slice(0,5) || '';
            $('edit-ev-sector').value = e.sector_pref || 'all';
            $('edit-ev-separation').checked = !!e.is_separated;
            $('edit-ev-men').value = e.quota_men ?? 0;
            $('edit-ev-women').value = e.quota_women ?? 0;
            navigate('edit-event');
        }

        async function saveEditEvent() {
            setBusy('edit-event-submit', true, 'שומר...');
            try {
                const ev = collectEventForm('edit-');
                validateEventPayload(ev);
                const coords = await geocodeAddress(ev.hall_address);
                const { error } = await _supabase.rpc('update_event', {
                    p_event_id:$('edit-event-id').value,
                    p_couple_names:ev.couple_names,
                    p_event_date:ev.event_date,
                    p_public_location:ev.public_location,
                    p_hall_address:ev.hall_address,
                    p_start_time:ev.start_time,
                    p_close_time:ev.close_time,
                    p_sector_pref:ev.sector_pref,
                    p_is_separated:ev.is_separated,
                    p_quota_men:ev.quota_men,
                    p_quota_women:ev.quota_women,
                    p_lat:coords.lat,
                    p_lng:coords.lng
                });
                if (error) throw error;
                alert('האירוע עודכן בהצלחה.');
                await loadDashboard();
            } catch(e) { alert(readableError(e)); }
            finally { setBusy('edit-event-submit', false); }
        }

        async function cancelHostEvent(eventId) {
            if (!confirm('לבטל את האירוע? כל הנרשמים יקבלו התראה בתוך האתר.')) return;
            const { error } = await _supabase.rpc('cancel_event', { p_event_id:eventId });
            if (error) alert(readableError(error)); else await loadDashboard();
        }

        function openProfileSettings() {
            if (!currentProfile) return;
            $('profile-name').value = currentProfile.full_name || '';
            $('profile-gender').value = currentProfile.gender || '';
            $('profile-sector').value = currentProfile.sector || 'all';
            $('profile-address').value = currentProfile.address || '';
            $('profile-radius').value = currentProfile.radius || 30;
            $('profile-days').value = currentProfile.max_days_per_week || 3;
            $('profile-separation').checked = !!currentProfile.strict_separation;
            navigate('profile-settings');
        }

        async function saveProfileSettings() {
            setBusy('profile-submit', true, 'שומר...');
            try {
                const address = $('profile-address').value.trim();
                let lat = currentProfile.lat, lng = currentProfile.lng;
                if (address && address !== (currentProfile.address || '')) {
                    const coords = await geocodeAddress(address); lat = coords.lat; lng = coords.lng;
                }
                const { error } = await _supabase.rpc('update_my_profile', {
                    p_full_name:$('profile-name').value.trim(),
                    p_gender:$('profile-gender').value || null,
                    p_sector:$('profile-sector').value,
                    p_address:address,
                    p_radius:Number($('profile-radius').value || 30),
                    p_max_days_per_week:Number($('profile-days').value || 3),
                    p_strict_separation:$('profile-separation').checked,
                    p_lat:lat,
                    p_lng:lng
                });
                if (error) throw error;
                await loadProfile();
                alert('הפרופיל עודכן.');
                await loadDashboard();
            } catch(e) { alert(readableError(e)); }
            finally { setBusy('profile-submit', false); }
        }

        async function renderAdminPanel() {
            const [{data:users},{data:events},{data:reports}] = await Promise.all([
                _supabase.from('profiles').select('id,full_name,email,phone,role,is_blocked,created_at').order('created_at',{ascending:false}).limit(25),
                _supabase.from('events').select('id,couple_names,event_date,public_location,status').order('event_date',{ascending:false}).limit(25),
                _supabase.from('event_reports').select('*').order('created_at',{ascending:false}).limit(25)
            ]);
            const eventMap = new Map((events||[]).map(e => [e.id,e]));
            return `<div class="glass-card p-6 border-2 border-slate-300">
                <h3 class="text-xl font-bold mb-1">פאנל ניהול</h3>
                <p class="text-sm text-slate-500 mb-5">מוצג רק למשתמשים שהוגדרו בטבלת admins.</p>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                    <div><h4 class="font-bold mb-3">משתמשים</h4><div class="space-y-2 max-h-96 overflow-auto">
                        ${(users||[]).map(u => `<div class="border rounded-lg p-3 text-sm bg-slate-50"><div class="font-bold">${esc(u.full_name)}</div><div class="text-slate-500" dir="ltr">${esc(u.email||'')} · ${esc(u.phone||'')}</div><div class="flex justify-between items-center mt-2"><span>${esc(u.role)}</span><button onclick="adminToggleBlock('${esc(u.id)}', ${!u.is_blocked})" class="${u.is_blocked?'bg-green-50 text-green-700':'bg-red-50 text-red-600'} px-2 py-1 rounded font-bold">${u.is_blocked?'פתח חסימה':'חסום'}</button></div></div>`).join('') || '<p class="text-slate-500">אין משתמשים.</p>'}
                    </div></div>
                    <div><h4 class="font-bold mb-3">אירועים</h4><div class="space-y-2 max-h-96 overflow-auto">
                        ${(events||[]).map(e => `<div class="border rounded-lg p-3 text-sm bg-slate-50"><div class="font-bold">${esc(e.couple_names)}</div><div class="text-slate-500">${formatDate(e.event_date)} · ${esc(e.public_location)} · ${esc(eventStatusLabel(e))}</div>${e.status!=='cancelled'?`<button onclick="adminCancelEvent('${esc(e.id)}')" class="mt-2 bg-red-50 text-red-600 px-2 py-1 rounded font-bold">בטל אירוע</button>`:''}</div>`).join('') || '<p class="text-slate-500">אין אירועים.</p>'}
                    </div></div>
                    <div><h4 class="font-bold mb-3">דיווחים</h4><div class="space-y-2 max-h-96 overflow-auto">
                        ${(reports||[]).map(r => { const ev=eventMap.get(r.event_id); return `<div class="border rounded-lg p-3 text-sm bg-slate-50"><div class="font-bold">${esc(ev?.couple_names || 'אירוע')}</div><div class="text-slate-600">${esc(r.reason || 'ללא פירוט')}</div><div class="text-xs text-slate-500 mt-1">סטטוס: ${esc(r.status)}</div>${r.status==='open'?`<div class="flex gap-2 mt-2"><button onclick="adminResolveReport('${esc(r.id)}','resolved')" class="bg-green-50 text-green-700 px-2 py-1 rounded font-bold">טופל</button><button onclick="adminResolveReport('${esc(r.id)}','dismissed')" class="btn-soft px-2 py-1">דחה</button></div>`:''}</div>`; }).join('') || '<p class="text-slate-500">אין דיווחים.</p>'}
                    </div></div>
                </div>
            </div>`;
        }

        async function adminToggleBlock(profileId, blocked) {
            if (!confirm(blocked ? 'לחסום את המשתמש?' : 'לפתוח את החסימה?')) return;
            const { error } = await _supabase.rpc('admin_set_blocked', {p_profile_id:profileId, p_blocked:blocked});
            if (error) alert(readableError(error)); else await loadDashboard();
        }

        async function adminResolveReport(reportId, status) {
            const { error } = await _supabase.rpc('admin_resolve_report', {p_report_id:reportId, p_status:status});
            if (error) alert(readableError(error)); else await loadDashboard();
        }

        async function adminCancelEvent(eventId) {
            if (!confirm('לבטל את האירוע כמנהל?')) return;
            const { error } = await _supabase.rpc('admin_cancel_event', {p_event_id:eventId});
            if (error) alert(readableError(error)); else await loadDashboard();
        }

        initAuth();
    </script>
</body>
</html>
