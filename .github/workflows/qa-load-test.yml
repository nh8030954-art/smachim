name: QA Load Test

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Load profile
        required: true
        default: staged
        type: choice
        options: [staged, spike, stress]

permissions:
  contents: read

jobs:
  qa-load:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      QA_BASE_URL: https://hnuinlqbbgejsvdiyihi.supabase.co
      QA_ORIGIN: https://smachim-qa.sharp-bee-1006.chatgpt.site
      PROD_REF: ybccbyyrrxdzarsgylql
      PROFILE: ${{ inputs.profile }}
    steps:
      - uses: actions/checkout@v4
      - name: Hard safety guard — QA only
        shell: bash
        run: |
          set -euo pipefail
          test "$QA_BASE_URL" = "https://hnuinlqbbgejsvdiyihi.supabase.co"
          if [[ "$QA_BASE_URL" == *"$PROD_REF"* ]]; then echo 'Refusing to load test Production'; exit 1; fi
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo 'deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main' | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6
      - name: Run QA load profile
        run: k6 run tests/load/qa-load.js
